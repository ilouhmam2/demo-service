services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["5432:5432"]

  nats:
    image: nats:2.10
    ports: ["4222:4222"]

  wiremock:
    image: wiremock/wiremock:3.9.2
    ports: ["8089:8080"]
    volumes:
      - ./wiremock:/home/wiremock